name: Build UNIVO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract ZIP
        run: |
          set -e
          ZIP=$(find . -type f -name '*.zip' -not -path './.git/*' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          BUILD_DIR=$(dirname "$SETTINGS")
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$BUILD_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find "$BUILD_DIR/app/build/outputs/apk" -type f -name '*.apk' -exec cp {} artifacts/ \;
          ls artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVO-Video-Editor-APK
          path: artifacts/*.apk
